name: Android CI and APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK, run unit tests, and lint
        run: |
          if ! ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug; then
            report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            if [[ -f "$report" ]]; then
              awk '/: Error:/{print; for (i=0; i<2 && getline; i++) print}' "$report"
            fi
            exit 1
          fi
      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenLauncher-debug
      - name: Publish prerelease test APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" app-debug.apk --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --generate-notes
